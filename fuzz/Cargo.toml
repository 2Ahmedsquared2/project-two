[package]
name = "project-two-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hl-latency = { path = "../crates/hl-latency" }
hl-capture = { path = "../crates/hl-capture" }
serde_json = "1"

[[bin]]
name = "hl_latency_parsers"
path = "fuzz_targets/hl_latency_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hl_capture_inputs"
path = "fuzz_targets/hl_capture_inputs.rs"
test = false
doc = false
bench = false

[workspace]
