[package]
name = "project-two-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hl-latency = { path = "../crates/hl-latency" }
serde = "1"
serde_json = "1"

[lib]
name = "project_two_fuzz"
path = "src/lib.rs"

[[bin]]
name = "hl_latency_parsers"
path = "fuzz_targets/hl_latency_parsers.rs"
test = false
doc = false
bench = false

[workspace]
