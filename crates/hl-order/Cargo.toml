[package]
name = "hl-order"
description = "Testnet-only Hyperliquid L1 action signer and order client: limit order (Alo/Gtc/Ioc), cancel by oid, scheduleCancel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# RustCrypto secp256k1: pure Rust, RFC 6979 deterministic nonces, low-s normalised,
# recoverable signatures. Same family as sha3, no C toolchain needed.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "precomputed-tables"] }
# Keccak-256 (the pre-NIST padding Ethereum uses). Implements io::Write so the
# msgpack encoder can stream straight into the hasher without a buffer.
sha3 = "0.10"
# Low-level msgpack writer: explicit, minimal-width encodings that match Python's
# msgpack.packb, without serde's struct-mapping choices in the way.
rmp = "0.8"
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
criterion = { version = "0.5", default-features = false }
# Test-only: fails a test when a signature allocates after warmup.
hl-alloc-gate = { path = "../hl-alloc-gate" }

[[bench]]
name = "sign_order"
harness = false

[[bench]]
name = "sign_percentiles"
harness = false

[lints]
workspace = true
