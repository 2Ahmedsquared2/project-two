[package]
name = "hl-capture"
description = "Capture side of the same-block latency probe: tails our node's hourly output files and filters public WebSocket frames, stamping each arrival at read time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
hl-latency = { path = "../hl-latency", version = "0.1.0" }
# Integer formatting for the writer thread's hand-written JSON lines.
itoa = "1"
memchr = "2"
rtrb = "0.3"
serde_json = { workspace = true }
# Safe signal handlers: flags only, plus the documented second-signal exit.
signal-hook = { version = "0.3", default-features = false }

# inotify exists on Linux only; elsewhere `--detect inotify` falls back to
# `poll` and says so (same shape as hl-replay's file-inotify arm).
[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false }
rustix = { version = "1", features = ["event"] }

[dev-dependencies]
hl-alloc-gate = { path = "../hl-alloc-gate" }
# tests/offset.rs: a captured line's offset is the strict pass's offset.
hl-strict-pass = { path = "../hl-strict-pass" }
proptest = { workspace = true }
tempfile = "3"

# tests/cli.rs: `O_NONBLOCK`, to fill the named pipe that holds the writer.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Plain timing harnesses (percentiles on stdout), not criterion:
#   cargo bench -p hl-capture --bench capture
#   cargo bench -p hl-capture --bench legacy
# `legacy` uses only the API of main at 3a197dc, so the same file measures
# the code from before this change in a checkout of that commit.
[[bench]]
name = "capture"
harness = false

[[bench]]
name = "legacy"
harness = false

# Issue #31: the reader's cost of a due look, and a new file's first-line
# delay through the real binary:
#   cargo bench -p hl-capture --bench rotation
[[bench]]
name = "rotation"
harness = false

[lints]
workspace = true
