[package]
name = "hl-replay"
description = "End-to-end replay harness: node line seen -> parsed -> book -> decision -> signed -> bytes handed to a loopback socket, timed into HDR histograms per runtime arm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = ["compio"]
# The two io_uring arms. On by default; build with `--no-default-features` if
# compio does not build on a host, and those arms report "unavailable".
compio = ["dep:compio"]

[dependencies]
hl-latency = { path = "../hl-latency" }
hdrhistogram = "7.6"
thiserror = { workspace = true }
serde = { workspace = true }
rmp-serde = "1.3"
sha3 = "0.10"
secp256k1 = { version = "0.29", features = ["recovery"] }
core_affinity = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util"] }
compio = { version = "=0.19.2", features = ["net", "runtime", "io-uring"], optional = true }

# inotify is a Linux kernel interface and the crate does not build elsewhere.
# Off Linux the file-inotify arm reports "unavailable" (`Arm::unsupported_on`).
[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false }

[dev-dependencies]
hl-alloc-gate = { path = "../hl-alloc-gate" }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
