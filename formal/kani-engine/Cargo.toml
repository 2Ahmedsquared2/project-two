[package]
name = "kani-engine"
description = "Kani harnesses for hl-exec (book invariants, matching, index consistency, rollback). Uses only hl-exec's public API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
hl-exec = { path = "../../crates/hl-exec" }

[features]
# Compile the descoped Kani harnesses in `src/descoped.rs` (only under
# `cargo kani`). They hit the 8 GiB cap or a timeout; see README.
descoped = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
